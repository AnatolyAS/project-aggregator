name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Извлечение исходного кода (Checkout)
        uses: actions/checkout@v4

      - name: Настройка среды Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка менеджера зависимостей Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Установка зависимостей проекта
        run: poetry install --no-interaction --no-root

      - name: Компиляция для Windows (с иконкой .ico)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "assets\app_icon.ico") {
            poetry run pyinstaller --onefile --windowed --name ProjectAggregator --icon=assets\app_icon.ico main.py
          } else {
            poetry run pyinstaller --onefile --windowed --name ProjectAggregator main.py
          }

      - name: Компиляция для macOS (с иконкой .icns)
        if: runner.os == 'macOS'
        run: |
          if [ -f "assets/app_icon.icns" ]; then
            poetry run pyinstaller --onefile --windowed --name ProjectAggregator_macOS --icon=assets/app_icon.icns main.py
          else
            poetry run pyinstaller --onefile --windowed --name ProjectAggregator_macOS main.py
          fi

      - name: Компиляция для Linux (с иконкой .png)
        if: runner.os == 'Linux'
        run: |
          if [ -f "assets/app_icon.png" ]; then
            poetry run pyinstaller --onefile --windowed --name ProjectAggregator_Linux --icon=assets/app_icon.png main.py
          else
            poetry run pyinstaller --onefile --windowed --name ProjectAggregator_Linux main.py
          fi

      - name: Автоматическая публикация файлов в GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ProjectAggregator*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}