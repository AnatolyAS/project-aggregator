name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Матрица сужена исключительно до ОС Windows
      matrix:
        os: [windows-latest]

    steps:
      - name: Извлечение исходного кода
        uses: actions/checkout@v4

      - name: Настройка среды Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Установка зависимостей
        run: poetry install --no-interaction --no-root

      - name: Компиляция для Windows (псевдоним pa.exe)
        run: |
          if (Test-Path "assets\windows.ico") {
            poetry run pyinstaller --onefile --windowed --name pa --icon=assets\windows.ico main.py
          } else {
            poetry run pyinstaller --onefile --windowed --name pa main.py
          }

      - name: Автоматическая публикация файлов в GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/pa*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}