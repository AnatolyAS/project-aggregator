<svg xmlns="http://w3.org" width="400" height="400" viewBox="0 0 124 124" fill="none">
  <defs>
    <!-- Градиент воронки -->
    <linearGradient id="funnelGradient" x1="0" y1="36.7818" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Задний план приложения -->
  <g id="background-layer">
    <rect width="124" height="124" rx="24" fill="#1E293B"/>
  </g>
  
  <!-- Исходные файлы проекта (Входные данные) -->
  <g id="input-files">
    <!-- Левый входящий файл -->
    <g id="file-left" opacity="0.85">
      <rect x="32" y="10" width="14" height="18" rx="2" fill="#64748B"/>
      <path d="M36 14 H42 M36 18 H42 M36 22 H40" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Центральный входящий файл -->
    <g id="file-center">
      <rect x="54" y="13" width="16" height="21" rx="2" fill="#94A3B8"/>
      <path d="M58 18 H66 M58 22 H66 M58 26 H63" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Правый входящий файл -->
    <g id="file-right" opacity="0.7">
      <rect x="78" y="10" width="14" height="18" rx="2" fill="#64748B"/>
      <path d="M82 14 H88 M82 18 H88 M82 22 H86" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Модуль гибкой агрегации (Воронка) -->
  <g id="aggregation-funnel" fill="url(#funnelGradient)">
    <!-- Верхний раструб воронки -->
    <path d="M19.375 36.7818 H104.625 L97 46 H27 Z"/>
    <!-- Средний сегмент воронки -->
    <path d="M29 49 H95 L88 58 H36 Z" opacity="0.95"/>
    <!-- Нижний сегмент воронки -->
    <path d="M38 61 H86 L81 67 H43 Z" opacity="0.9"/>
    <!-- Горловина воронки -->
    <path d="M44 71 H80 L76 77 H48 Z" opacity="0.85"/>
    <!-- Излив воронки -->
    <path d="M49 80 H75 L71 86 H53 Z" opacity="0.8"/>
  </g>
  
  <!-- Результирующий агрегированный файл (Выходные данные) -->
  <g id="output-file">
    <rect x="54" y="93" width="16" height="21" rx="2" fill="#06B6D4"/>
    <path d="M58 98 H66 M58 102 H66 M58 106 H63" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
